[project]
name = "resume-analyzer"
version = "0.1.0"
description = "A Flask portfolio app that ranks PDF and DOCX resumes against a job description using Groq-powered structured AI analysis."
readme = "README.md"
authors = [
    { name = "Mokash Kumar" }
]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=23.0.0",
    "groq>=1.6.0",
    "pydantic>=2.13.4",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
